# Model catalog seed data (C-004).
#
# Migrated from the deprecated config/registries/model_registry.yaml
# (B-001/B-003). Per ADR-042, only the fields the canonical Model entity
# actually has are represented as structured fields; B's additional
# per-model fields (context_limit, tool_calling, structured_output,
# cost_class, quota, preferred_roles) are descriptive-only for this
# entity today and are folded into `notes` rather than given dedicated
# columns, matching the same reasoning already applied to
# Provider.cache_characteristics in ADR-042.
#
# `capabilities` below drops "fast_general" from the original B-side
# entry -- rejected as a capability-vocabulary member by ADR-042 (it
# describes a cost/latency tier, not a task-type capability).

models:
  - model_id: groq-openai-gpt-oss-120b
    provider_id: groq
    provider_model_name: openai/gpt-oss-120b
    capabilities: [tool_use, coding, summarization, classification]
    status: available
    depends_on: [groq]
    verification_date: "2026-08-31"
    verification_source: "B-008 live validation against the real Groq API, GET /v1/models (see DEVELOPMENT_STATE/decisions.yaml, B-DEC entry for B-008)"
    verification_status: verified
    notes: >
      Replaces groq-llama-3.3-70b-versatile (B-001/B-003), which was
      confirmed retired via a live 404 from Groq's API during B-008's
      live gate: "The model `llama-3.3-70b-versatile` does not exist
      or you do not have access to it." openai/gpt-oss-120b confirmed
      live via GET /v1/models and supports tool calling. context_limit:
      see live model listing (not re-verified field-by-field in this
      update; only provider_model_name and status were corrected).
      cost_class: free. No card required for the free tier. Not an
      architectural dependency -- fully replaceable behind
      ProviderAdapter. This is exactly the kind of drift
      06_REGISTRIES/MODEL_REGISTRY.md's "verified_at requires
      revalidation" discipline exists to catch.

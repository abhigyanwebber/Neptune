# Model registry data.
#
# Per 06_REGISTRIES/MODEL_REGISTRY.md: entries here are snapshots and
# must be revalidated before production use. The `model:` field
# (provider-facing name) was corrected during B-008's live validation:
# Groq confirmed via a live 404 that "llama-3.3-70b-versatile" no
# longer exists ("does not exist or you do not have access to it"),
# and a live GET /v1/models call confirmed "openai/gpt-oss-120b" as a
# current, tool-calling-capable replacement. The `id:` key is left
# unchanged (existing tests reference it by name); only the
# provider-facing `model:` value and verification metadata changed.
# This is a data-staleness fix, not an architectural change -- this
# is exactly the kind of drift the "entries here are snapshots"
# discipline above exists to catch.

models:
  - id: groq-llama-3.3-70b-versatile
    provider: groq
    model: openai/gpt-oss-120b
    capabilities:
      - fast_general
      - tool_use
      - coding
      - summarization
      - classification
    context_limit: 131072
    tool_calling: true
    structured_output: true
    cost_class: free
    quota: "~30 requests/min, ~6000 tokens/min, ~1000 requests/day (free tier, subject to change)"
    health: unknown
    availability: available
    verified_at: "2026-08-31"
    fallbacks: []
    preferred_roles:
      - coder
      - extraction_worker
    notes: >
      Reference candidate for the first single-provider vertical slice
      (ADR-033). No card required for the free tier. Not an
      architectural dependency -- fully replaceable behind
      ProviderAdapter. Rate limits are provider-published and were not
      load-tested as part of this task.

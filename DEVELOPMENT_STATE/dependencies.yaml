dependencies:
  - task_id: B-001-model-gateway-foundation
    depends_on: []
    note: >
      Deliberately buildable against frozen contracts alone; no
      dependency on Claude A's Stage 0/1 repositories.
    blocks:
      - "future: live single-provider vertical slice (needs
         GROQ_API_KEY provisioning + director authorization)"
      - "future: A's end-to-end task/session/turn -> Gateway wiring
         (needs A's task/session identifiers to be real, not just
         strings, once Stage 1 lands)"

  - task_id: NEPTUNE-A-STAGE0-1-CORE
    depends_on: []
    note: "No dependency on Claude B's work; Core lane starts independently per 14_DEVELOPMENT_ORCHESTRATION/03_WORK_ALLOCATION.md."
  - task_id: NEPTUNE-B-MODEL-GATEWAY
    depends_on:
      - NEPTUNE-A-STAGE0-1-CORE
    note: >
      Model Gateway / tool execution (Claude B, later stage) will read the
      Task/Session/Event/Checkpoint contracts in src/core/contracts and
      write Turns/Events through those repository interfaces. This entry
      documents the integration point, not an active B task yet.

  - task_id: NEPTUNE-A-RUNTIME-STAGE2-CORE
    depends_on:
      - NEPTUNE-A-STAGE0-1-CORE
    note: "Runtime engine consumes the Stage 0/1 repository contracts directly; no new persistence work required."

  - task_id: NEPTUNE-B-MODEL-GATEWAY-IMPL
    depends_on:
      - NEPTUNE-A-RUNTIME-STAGE2-CORE
    note: >
      Claude B's real Model Gateway must satisfy core.contracts.gateway.ModelGatewayPort
      (.send(request: dict) -> dict). AgentRuntime currently runs against
      core.runtime.fakes.FakeModelGateway for tests/dev; swapping in B's real
      implementation requires no Core code changes, only a different object
      passed into AgentRuntime's constructor.

  - task_id: NEPTUNE-B-TOOL-LAYER-IMPL
    depends_on:
      - NEPTUNE-A-RUNTIME-STAGE2-CORE
    note: >
      Claude B's real Tool/Permission/sandbox layer must satisfy
      core.contracts.tools.ToolPort (.execute(tool_call: dict) -> dict).
      Same swap-in relationship as the Model Gateway above.

  - task_id: NEPTUNE-A-003-REGISTRY
    depends_on:
      - NEPTUNE-A-STAGE0-1-CORE
    note: "Registry follows the same repository-contract + SQLAlchemy pattern as Stage 0/1; no new persistence approach introduced."

  - task_id: NEPTUNE-B-PROVIDER-REGISTRATION
    depends_on:
      - NEPTUNE-A-003-REGISTRY
    note: >
      Claude B registers real provider records (groq/openrouter/gemini/openai/
      cerebras/mistral) through ProviderRegistry.register() as providers come
      online, and real tool records through ToolRegistry.register(). Core
      only owns the catalog; B owns populating it with real, verified data.

  - task_id: NEPTUNE-ROUTER-CAPABILITY-LOOKUP
    depends_on:
      - NEPTUNE-A-003-REGISTRY
    note: >
      The future Router (ROUTER_CONTRACT.md: "Routing is capability-oriented")
      resolves candidate providers via ProviderRegistry.find_by_capability()
      and candidate tools via ToolRegistry.find_by_capability(). This entry
      documents the integration point; no Router task is active yet.

  - task_id: NEPTUNE-A-004-REGISTRY-POPULATION
    depends_on:
      - NEPTUNE-A-003-REGISTRY
    note: >
      Loader/exporter/audit operate on the registry service classes from
      A-003 without changing their public shape; verification metadata
      fields are additive. Also fixes a Stage-0/1-era bug (EventModel.task_id
      ForeignKey) discovered while wiring the audit trail -- see ADR-A-010.

  - task_id: NEPTUNE-B-PROVIDER-REGISTRATION-UPDATE
    depends_on:
      - NEPTUNE-A-004-REGISTRY-POPULATION
    note: >
      Supersedes the NEPTUNE-B-PROVIDER-REGISTRATION note above: as of A-004,
      groq/openrouter/gemini/ollama/openai_compatible already have a verified
      baseline entry in 06_REGISTRIES/data/providers.yaml (base URL,
      OpenAI-compatibility, auth method). Claude B's job is to layer live
      operational data on top (current models, rate limits, uptime) via
      ProviderRegistry.update(), not to register these five from scratch.
      openai/cerebras/mistral remain unregistered -- still B's to add.

  - task_id: NEPTUNE-DIRECTOR-ALEMBIC-DECISION
    depends_on: []
    note: >
      Flagged, not resolved: A-004 needed a local dev Postgres volume reset
      twice (verification_date/source/status columns, then the FK removal)
      because create_all() doesn't alter existing tables. This is the second
      time schema evolution has required a manual reset (see A-004 known
      limitations). Recommend the director weigh introducing a minimal
      Alembic setup now that there's concrete recurring cost evidence, vs.
      continuing to defer it.

  - task_id: NEPTUNE-A-005-RUNTIME-DRIVER
    depends_on:
      - NEPTUNE-A-RUNTIME-STAGE2-CORE
    note: >
      RuntimeDriver is a pure consumer of AgentRuntime's seven public
      methods (create_task, start_agent_run, start_session, run_turn,
      checkpoint, resume, complete_task) -- no changes to engine.py were
      needed or made.

  - task_id: NEPTUNE-B-MODEL-GATEWAY-DRIVER-SIGNAL
    depends_on:
      - NEPTUNE-A-005-RUNTIME-DRIVER
    note: >
      Once Claude B's real Model Gateway exists, RuntimeDriver.should_complete
      currently uses only "did this turn make tool_calls" as its completion
      signal (ADR-038). If the real Gateway's normalized response includes a
      richer completion signal (finish_reason, structured stop signal, etc.),
      that's the point to revisit should_complete/should_continue with a
      second real signal instead of the current single-signal policy.

  - task_id: NEPTUNE-A-006-RESOLUTION-LAYER
    depends_on:
      - NEPTUNE-A-003-REGISTRY
      - NEPTUNE-A-004-REGISTRY-POPULATION
    note: >
      ProviderResolver/ResourceResolver are pure consumers of the four
      registry service classes and the existing resolve_dependencies()
      function from A-003 -- no registry code was modified.

  - task_id: NEPTUNE-ROUTER-USES-RESOLUTION-LAYER
    depends_on:
      - NEPTUNE-A-006-RESOLUTION-LAYER
    note: >
      The future Router (ROUTER_CONTRACT.md) should call
      ProviderResolver.resolve_provider() rather than querying
      ProviderRegistry.find_by_capability() directly, so routing benefits
      from the ranking/dependency-expansion logic in one place. This entry
      documents the integration point; no Router task is active yet.

  - task_id: NEPTUNE-B-PROVIDER-METADATA-FOR-RANKING
    depends_on:
      - NEPTUNE-A-006-RESOLUTION-LAYER
    note: >
      ADR-039's ranking currently uses only status + verification_status.
      If Claude B's provider registrations start carrying live operational
      metadata (latency, rate-limit headroom), that's the point to extend
      ProviderResolver._rank_key with a real third signal instead of the
      alphabetical-id tiebreak.

  - task_id: NEPTUNE-A-007-PLANNING-LAYER
    depends_on:
      - NEPTUNE-A-003-REGISTRY
    note: >
      PlanExecutor's dependency-graph validation reuses
      core.registry.dependency_resolution.resolve_dependencies() unchanged
      (A-003) -- no new cycle-detection code, no registry code modified.

  - task_id: NEPTUNE-PLAN-GENERATION-NOT-YET-BUILT
    depends_on:
      - NEPTUNE-A-007-PLANNING-LAYER
    note: >
      A-007 deliberately builds only the Plan/PlanStep contracts and
      PlanExecutor control flow -- every test plan is hand-authored. Actual
      goal-to-plan decomposition (the "sophisticated reasoning" and
      "research logic" the brief explicitly excludes) is future work once
      a real Model Gateway exists to generate steps against. This entry
      documents that gap; no task is active for it yet.

  - task_id: NEPTUNE-RUNTIME-DRIVER-PLAN-INTEGRATION-NOT-YET-BUILT
    depends_on:
      - NEPTUNE-A-007-PLANNING-LAYER
      - NEPTUNE-A-005-RUNTIME-DRIVER
    note: >
      RuntimeDriver (A-005) and PlanExecutor (A-007) are independent today
      -- RuntimeDriver drives Turns within a Session; PlanExecutor drives
      PlanSteps within a Plan. Neither references the other
      (RuntimeDriver.driver.py was explicitly not modified this task). A
      future task may want a PlanStep's capability_id to inform which
      Turn/tool_call gets requested, but that wiring doesn't exist yet and
      wasn't in scope for A-007.
  - task_id: B-006-tool-execution-recovery-validation
    depends_on:
      - NEPTUNE-A-005-RUNTIME-DRIVER
      - B-004-tool-execution-boundary
    note: >
      Requires both branches merged locally to exist in the same
      workspace (see B-DEC-017). Satisfies NEPTUNE-B-TOOL-LAYER-IMPL
      above by providing a real ToolPort implementation wrapping
      ToolExecutorService/EchoTool.

  - task_id: NEPTUNE-C-004-CANONICAL-REGISTRY-MIGRATION
    depends_on:
      - NEPTUNE-C-001-REGISTRY-CONSOLIDATION-ANALYSIS
      - NEPTUNE-A-003-REGISTRY
      - NEPTUNE-A-004-REGISTRY-POPULATION
    note: >
      Implements ADR-041's decision (Postgres-backed registry is
      canonical). Adds the Model entity ADR-041/DIRECTOR_DECISION_REGISTRY.md
      §4 named as required follow-up work item #1, and Provider field
      extension (#2) and capability reconciliation (#3). Items #4
      (ModelGatewayPort adapter) and #5 (GatewayService cutover) remain
      unbuilt -- explicitly out of scope for this task.

  - task_id: NEPTUNE-MODELGATEWAY-ADAPTER-STILL-PENDING
    depends_on:
      - NEPTUNE-C-004-CANONICAL-REGISTRY-MIGRATION
    note: >
      The canonical registry can now represent everything a future
      ModelGatewayPort adapter would need (Model entity, extended
      Provider operational metadata, reconciled capability vocabulary),
      but the adapter itself (DIRECTOR_REVIEW_001.md's top recommendation,
      and DIRECTOR_DECISION_REGISTRY.md §4 item #4) has not been built.
      GatewayService still reads from the deprecated YAML ModelRegistry.
      This is the next logical step after director review of C-004.

  - task_id: NEPTUNE-C-006-CAPABILITY-VOCABULARY-BRIDGE
    depends_on:
      - NEPTUNE-C-001-REGISTRY-CONSOLIDATION-ANALYSIS
      - C-002-C-003-repository-correction-sprint
      - NEPTUNE-C-004-CANONICAL-REGISTRY-MIGRATION
      - C-005-legacy-registry-consumer-audit
    note: >
      capability_bridge.py implements the translation shape ADR-042
      already decided (which legacy capability values map 1:1, which
      are rejected and why) -- no new reconciliation logic, mechanical
      only. Depends on C-004 for KNOWN_CAPABILITIES already containing
      summarization/classification/embedding, and on C-005 for the
      confirmed inventory of what actually consumes the legacy
      Capability enum (used to verify no consumer needed direct
      modification this task).

  - task_id: NEPTUNE-GATEWAYSERVICE-CUTOVER-CAN-NOW-USE-BRIDGE
    depends_on:
      - NEPTUNE-C-006-CAPABILITY-VOCABULARY-BRIDGE
      - NEPTUNE-MODELGATEWAY-ADAPTER-STILL-PENDING
    note: >
      When the ModelGatewayPort adapter (still pending) or a direct
      GatewayService cutover is eventually built, it should call
      core.registry.capability_bridge.translate_capability(s)() when
      converting a legacy Capability enum value (via .value) into a
      canonical capability_id for CapabilityResolver/ProviderResolver,
      rather than assuming the two vocabularies stay string-identical
      forever. This entry documents the integration point; no cutover
      task is active yet.

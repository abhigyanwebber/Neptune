decisions:
  - id: B-DEC-001
    task_id: B-001-model-gateway-foundation
    decision: >
      Selected Groq (llama-3.3-70b-versatile) as the first vertical-
      slice provider candidate. Free tier, no card required,
      OpenAI-compatible surface, tool calling supported. Not locked in
      architecturally -- registered as ordinary data in
      config/registries/*.yaml and accessed only through
      ProviderAdapter.
    alternatives_considered: "Gemini free lane, Cerebras, Mistral, OpenRouter :free (per R01 snapshot in MODEL_REGISTRY.md)"
    reversible: true

  - id: B-DEC-002
    task_id: B-001-model-gateway-foundation
    decision: >
      Implemented ModelGatewayService.infer() to raise
      ModelGatewayError(ModelError) on failure rather than returning a
      ModelResult | ModelError union, per REFERENCE_INTERFACES.md's
      note that exact syntax may vary. Keeps the happy-path type
      unambiguous for callers.
    reversible: true

  - id: B-DEC-003
    task_id: B-001-model-gateway-foundation
    decision: >
      Router scoring left intentionally simple (capability match +
      availability + cost-class ceiling + sticky/preferred provider,
      then quota_remaining) since ROUTER_CONTRACT defers "exact
      scoring formula, weighting, health algorithm" to implementation.
      Lives in infrastructure/routing/, not core, so it can be
      replaced without touching the frozen contract.
    reversible: true

  - id: B-DEC-004
    task_id: B-001-model-gateway-foundation
    decision: >
      GroqAdapter imports litellm lazily inside invoke(), not at
      module scope, so the module (and the full test suite) can be
      imported/run without litellm installed. No live call was made;
      GROQ_API_KEY is read only at invoke() time.
    reversible: true


  - id: B-DEC-005
    task_id: B-002-integration-candidate-evaluation
    decision: >
      Recommended stack: provider primary=groq, fallback_chain=
      [openrouter, cerebras, gemini, mistral]; tool_layer=pattern
      reuse only (codex_cli, cline, openhands -- no candidate scored
      "directly reusable"); sandbox primary=docker_local,
      fallback=e2b; mcp primary=official protocol via fastmcp.
      Full justification in 06_REGISTRIES/integration_registry.yaml
      recommended_stack block.
    reversible: true

  - id: B-DEC-006
    task_id: B-002-integration-candidate-evaluation
    decision: >
      Flagged two upstream status changes materially affecting the
      Bible's original candidate assumptions: Roo Code archived
      May 2026 (no longer a live dependency target -- pattern only),
      and Daytona's self-host story downgraded after its open-source
      repo reportedly stopped accepting contributions ~June 2026.
      Gemini CLI is also being retired June 18 2026. None of these
      required a contract change; recorded as research findings.
    reversible: false
    note: "Factual finding, not a design choice -- recorded for traceability."


  - id: B-DEC-007
    task_id: B-003-first-real-provider-integration
    decision: >
      Implemented GroqAdapter with `requests` making direct HTTPS
      calls to Groq's OpenAI-compatible REST endpoint, not LiteLLM.
      litellm is still not installed in this environment, and the
      task explicitly required "Real HTTPS requests" with "no provider
      SDK leakage" -- a direct requests-based implementation is
      simpler to test (precise control over mocked HTTP status codes
      for the failure-validation matrix) and has one fewer dependency.
      ADR-032's LiteLLM boundary is not violated: LiteLLM remains the
      recommended normalization transport at the architecture level,
      this is an implementation-detail substitution for one adapter,
      fully reversible.
    reversible: true

  - id: B-DEC-008
    task_id: B-003-first-real-provider-integration
    decision: >
      Built scripts/run_live_groq_smoke_test.py as a Runtime stand-in
      rather than waiting on Claude A's Stage 0/1 Task/Session/Turn
      objects, so the request still "originates through Neptune
      contracts, not direct adapter invocation" as required. It
      constructs a ModelRequest with placeholder task/session/turn id
      strings and drives ModelGatewayService.infer() -- the same path
      a real Runtime will use once A's Stage 1 lands. Documented
      explicitly as a stand-in, not a competing implementation of A's
      domain (per B-001/B-002 dependency notes).
    reversible: true

  - id: B-DEC-009
    task_id: B-003-first-real-provider-integration
    decision: >
      Registry updates from live capability discovery are not
      auto-written by code. scripts/probe_groq_models.py fetches the
      live model list and prints it for human review; a person then
      updates config/registries/model_registry.yaml by hand. This
      matches the existing registry discipline (snapshots require
      revalidation, not silent overwrite) established in B-001/B-002.
    reversible: true


  - id: B-DEC-010
    task_id: B-003-first-real-provider-integration
    decision: >
      Live validation completed and B-003 closed. Human operator
      supplied GROQ_API_KEY for one-time in-memory use in a single
      terminal session ($env:GROQ_API_KEY set per-process, never
      via setx/System Properties, never written to .env or any repo
      file). Confirmed via literal-string repository search
      (0 matches) that the key does not appear anywhere in the
      working tree. The key was not retained after validation; this
      worker holds no copy of it.
    reversible: false
    note: "Factual record of a validation event and its handling, not a design choice."

  - id: B-DEC-011
    task_id: B-003-first-real-provider-integration
    decision: >
      Fixed a real bug surfaced only by the live call: registry.py's
      candidates_for() populated RoutingCandidate.model_id from
      ModelRecord.id (the registry's internal key, e.g.
      "groq-llama-3.3-70b-versatile") instead of ModelRecord.model
      (the provider's actual model name, "llama-3.3-70b-versatile").
      Every mocked/unit test passed regardless, because none of them
      exercised the real registry against a real provider -- this is
      exactly the class of bug B-003 exists to catch. One-line fix,
      contracts unchanged, RoutingCandidate/ModelRecord schemas
      unchanged. Updated the two assertions in test_registry.py that
      depended on the old (incorrect) value.
    reversible: true


  - id: B-DEC-012
    task_id: B-004-tool-execution-boundary
    decision: >
      Implemented core/contracts/tool_execution.py to give TOOL_CONTRACT
      a concrete shape, same pattern as B-001's treatment of
      MODEL_CONTRACT/PROVIDER_CONTRACT/ROUTER_CONTRACT: this is
      implementing the frozen contract, not modifying it. ToolCall/
      ToolResult reuse ToolDefinition from model_gateway.py rather than
      duplicating it, per "use contracts already defined by Core."
    reversible: true

  - id: B-DEC-013
    task_id: B-004-tool-execution-boundary
    decision: >
      ToolExecutor.execute() never raises for tool-level failures
      (missing tool, invalid input, timeout, oversized output, or even
      an unrelated unhandled exception inside a tool) -- all are
      normalized into ToolResult(outcome=...). This directly implements
      TOOL_CONTRACT's "return structured success/error information"
      responsibility and invariant 1 (tool existence/lookup failure is
      data, not a control-flow event the Runtime must catch specially).
      Timeout enforced via ThreadPoolExecutor.result(timeout=...);
      output-size enforced via a JSON-serialized byte-length check.
      Both defaults (10s, 32000 bytes) are implementation-level, per
      TOOL_CONTRACT's explicit deferral of "timeout defaults."
    reversible: true

  - id: B-DEC-014
    task_id: B-004-tool-execution-boundary
    decision: >
      No permission/authorization check was added anywhere in the
      executor path -- TOOL_CONTRACT explicitly lists "deciding whether
      the agent is authorized" as a non-responsibility, and B-004's
      scope did not include PERMISSION_CONTRACT. ToolExecutor executes
      any ToolCall handed to it; a future task must insert the
      authorization decision before execute() is called (Runtime's
      job, not the executor's).
    reversible: true
    note: "Scope boundary, not a design preference -- flagging for the next task's context."


  - id: B-DEC-015
    task_id: B-005-observation-feedback-loop
    decision: >
      Observation format fixed as a single role="tool" ContextMessage
      with a deterministic natural-language template (sorted-key JSON
      for success, "failed (outcome): message" for failure). Full
      rationale and consequences recorded in
      05_DECISIONS/ADR-043-observation-feedback-format.md (renumbered
      from ADR-037 during B-006, from ADR-039 during the C-002
      correction sprint, and from ADR-041 during C-005 -- see
      B-DEC-017, C-DEC-001, C-DEC-004) rather than
      only here, since this is a format decision future tasks need to
      find without reading DEVELOPMENT_STATE history.
    reversible: true

  - id: B-DEC-016
    task_id: B-005-observation-feedback-loop
    decision: >
      Modified MockProviderAdapter (infrastructure/providers/
      reference_adapter.py) to support a two-turn scenario: it now
      checks for a prior role="tool" message in request.messages and,
      if present, stops emitting tool_intents and returns a final
      answer referencing the observation content instead. Also changed
      its canned tool call from arguments={} to
      arguments={"text": "hello"}, since {} correctly fails EchoTool's
      input validation and every existing test happened to bypass
      intent.arguments by constructing its own ToolCall by hand.
      This is a test-double enhancement, not a new tool and not
      provider-specific logic in observation_loop.py itself -- the
      loop only ever calls the ModelGateway/ToolExecutor Protocols.
      Verified no regressions: full suite still passes (48 passed, 4
      skipped) after the change.
    reversible: true

  - id: ADR-A-001
    made_by: claude-a
    title: "Accept reference stack for Stage 0/1: Python + SQLAlchemy 2.0 + PostgreSQL"
    rationale: >
      06_REGISTRIES/REFERENCE_STACK_REGISTRY.md candidates are adequate,
      free-tier-friendly, and match what Claude B will likely also assume.
      No genuine technical reason found to deviate; re-evaluating would be
      optimization without justification (per director's Technology
      Question guidance).
    status: recorded
  - id: ADR-A-002
    made_by: claude-a
    title: "Repository pattern: one commit per call, sessionmaker-injected"
    rationale: >
      SESSION_CONTRACT.md explicitly defers "exact session persistence;
      concurrency model." Chose the simplest correct unit-of-work (one
      transaction per repository call) as a Stage 1 baseline rather than
      speculatively building multi-statement transaction/unit-of-work
      machinery no consumer has asked for yet.
    status: recorded
  - id: ADR-A-003
    made_by: claude-a
    title: "Local Postgres via docker-compose on host port 5433"
    rationale: >
      Keeps the $0 baseline (Bible primary objective) and avoids clashing
      with any pre-existing local Postgres on the default 5432 port.
      NEPTUNE_DATABASE_URL env var overrides for any other
      Postgres-compatible target without code changes.
    status: recorded

  - id: ADR-A-004
    made_by: claude-a
    title: "No generalized Agent/Session/Turn transition-rule tables for the runtime stage"
    rationale: >
      Director explicitly warned against silently inventing a large frozen
      lifecycle-rule library after Stage 0/1 added Task's transition table.
      Agent/Session/Turn status changes are enforced procedurally inside
      AgentRuntime (src/core/runtime/engine.py) at exactly the points the
      Task -> Agent Run -> Session -> Turn -> Checkpoint lifecycle needs
      them, not as a separate generalized validated-transition class like
      Task's. Task keeps its table because task.schema.json's status enum
      made a formal contract explicit; Agent/Session/Turn have no
      equivalent Bible-specified enum, so a formal table would be
      implementation speculation, not contract-following.
    status: recorded
  - id: ADR-A-005
    made_by: claude-a
    title: "Model Gateway / Tool boundary as Python Protocols returning opaque dicts"
    rationale: >
      core.contracts.gateway.ModelGatewayPort and core.contracts.tools.ToolPort
      take/return plain dicts rather than typed request/response models.
      Core does not know or need to know the shape of a real provider's
      request/response -- that normalization is Claude B's Model Gateway
      responsibility (ADR-003, ADR-032). Turn.model_request/model_response
      already persist as opaque JSON (Stage 0/1), so this keeps the
      runtime and persistence layers consistent instead of introducing a
      second, narrower schema Core would have to keep in sync.
    status: recorded
  - id: ADR-A-006
    made_by: claude-a
    title: "Tool-call loop does not auto-repeat within a single run_turn() call"
    rationale: >
      After executing the tool_calls in a model response, the engine does
      not automatically send the resulting observations back to the model
      for a follow-up response within the same turn -- that would be
      express a loop *policy* (when to keep looping vs. hand back to the
      caller), which belongs to the future agent-loop driver built on top
      of this runtime, not to Core's control-plane primitives. The
      director's brief asks for orchestration machinery, not the actual
      loop-continuation policy. _MAX_TOOL_ROUNDS_PER_TURN in engine.py is
      a safety ceiling for future policies that do choose to loop, not an
      active behavior yet.
    status: recorded

  - id: ADR-A-007
    made_by: claude-a
    title: "Fixed-vocabulary registries with a strict/non-strict register() switch"
    rationale: >
      The four registries validate capability_id/provider_id/resource_id/
      tool_id against the exact vocabularies given in task A-003 by
      default (strict=True). A non-strict mode is also exposed so the
      registries can still store forward-compatible entries (new
      providers, new capabilities) as data without a code change once B or
      the director expands the vocabulary -- consistent with
      06_REGISTRIES/PROVIDER_REGISTRY.md's framing of registry entries as
      "operational data," not frozen architecture.
    status: recorded
  - id: ADR-A-008
    made_by: claude-a
    title: "Registry domain + service classes live together in core/registry/*.py per-file, not split into core/domain + infrastructure like Stage 0/1"
    rationale: >
      Task A-003 explicitly specified the file layout (core/registry/
      capability_registry.py etc.), one file per registry combining the
      dataclass and the thin service class. To keep core/ provider-
      independent per the existing contract test
      (test_core_has_no_infrastructure_or_provider_imports), each
      core/registry/*.py file imports its matching Protocol from
      core/contracts/registry.py only under `TYPE_CHECKING`, avoiding a
      runtime circular import between contracts/registry.py (which imports
      the dataclasses) and registry/*.py (which would otherwise import the
      Protocols). SQLAlchemy implementations still live entirely in
      infrastructure/persistence, matching Stage 0/1's dependency
      direction.
    status: recorded
  - id: ADR-A-009
    made_by: claude-a
    title: "Dependency resolution is a single cross-registry pure function, not per-registry logic"
    rationale: >
      A dependency (e.g. a tool depending on a resource) can point across
      registry boundaries, so resolution can't live inside just one
      registry class without that class reaching into the others.
      core/registry/dependency_resolution.py implements a generic
      topological sort over an id -> depends_on map the caller assembles
      from whichever registries are relevant, with cycle detection
      (DependencyCycleError) and an UnresolvedDependencyError for
      references to entries that don't exist. This keeps each registry
      class simple and keeps the resolution algorithm independent of which
      registry an id came from.
    status: recorded

  - id: ADR-A-010
    made_by: claude-a
    title: "Registry audit events use a sentinel task_id; removed an incorrect ForeignKey on EventModel.task_id"
    rationale: >
      Task A-004 requires registry mutations to emit Events via the
      existing Event infrastructure, but registry entries aren't scoped to
      any Task. event.schema.json (FROZEN) requires task_id to be a
      non-null string -- it does NOT require that string to reference an
      existing Task row. core/registry/audit.py uses a documented sentinel
      task_id ("system-registry") for these events rather than weakening
      the frozen schema. This surfaced a real bug: EventModel.task_id
      (infrastructure/persistence/models/orm.py) had a
      ForeignKey("tasks.task_id") constraint that was never required by
      the contract. SQLite silently ignored it (constraints unenforced by
      default), so it passed every SQLite-backed test through A-003, but
      Postgres enforced it and rejected the first non-task-scoped event.
      Fixed by removing the ForeignKey (task_id stays a required, non-null
      String column -- only the referential-integrity constraint is
      gone). This is a persistence-layer bugfix, not a change to the
      frozen Event contract.
    status: recorded
    known_limitation: >
      Fixing this required a local dev Postgres volume reset
      (`docker compose down -v`) since create_all() doesn't alter existing
      tables. Recorded as NEPTUNE-DIRECTOR-ALEMBIC-DECISION in
      dependencies.yaml for the director's judgment call.

  - id: ADR-A-011
    made_by: claude-a
    title: "Expanded KNOWN_PROVIDERS to include ollama and openai_compatible"
    rationale: >
      Task A-004 explicitly asked for Groq, OpenRouter, Gemini, Ollama, and
      OpenAI-compatible provider entries -- two of which (ollama,
      openai_compatible) were outside A-003's original fixed vocabulary
      (groq/openrouter/gemini/openai/cerebras/mistral). This is an
      additive vocabulary expansion under explicit director instruction,
      not a unilateral scope change -- consistent with ADR-A-007's
      strict/non-strict design already anticipating vocabulary growth.
      openai_compatible is registered as provider_type "pattern" (not
      "model_provider") since it represents the OpenAI-compatibility
      protocol itself rather than a specific hosted vendor -- documented
      in 06_REGISTRIES/data/providers.yaml so this distinction isn't lost.
    status: recorded

  - id: ADR-A-012
    made_by: claude-a
    title: "RuntimeDriver: single-signal (tool_calls presence) continue/complete/stop policy"
    rationale: >
      Full rationale in 05_DECISIONS/ADR-038-runtime-driver-policy.md.
      Summary: the only signal RuntimeDriver uses to decide whether a Turn
      is final is whether the model made tool calls that turn --
      deliberately not parsing model_response.content or assuming any
      provider-specific completion field, since neither exists yet
      (Gateway/Tool boundary are opaque dicts by design, ADR-A-005) and
      the director's brief forbids provider-specific assumptions.
      tool_failed is a hard stop, not a retry (retry policy is
      undesigned, not defaulted). Driver-level max_turns is distinct from
      and does not touch engine.py's internal _MAX_TOOL_ROUNDS_PER_TURN.
      Checkpointing after every turn by default guarantees a checkpoint
      exists at whatever point execution stops, so resume always has
      something to resume from.
    status: recorded

  - id: ADR-A-013
    made_by: claude-a
    title: "Resolution layer: status + verification_status + alphabetical-id provider ranking"
    rationale: >
      Full rationale in 05_DECISIONS/ADR-039-resolution-layer-selection-policy.md.
      Summary: ProviderResolver ranks eligible providers by reliability
      status (RETIRED excluded entirely, not just ranked last), then
      verification_status, then provider_id alphabetically as a
      deterministic tiebreak -- no provider name or vendor-specific field
      is ever read. Unrecognized status/verification_status values sort
      after known ones rather than raising, so a future vocabulary
      expansion (as already happened once, ADR-A-011) doesn't break
      resolution. "No eligible provider" returns a ResolutionResult with
      provider=None rather than raising, consistent with this layer doing
      selection only, never execution.
    status: recorded

  - id: ADR-A-014
    made_by: claude-a
    title: "Plan step ordering, failure cascade, and JSON-blob persistence"
    rationale: >
      Full rationale in 05_DECISIONS/ADR-040-plan-executor-policy.md.
      Summary: select_next_step() follows Plan.steps declared order
      (deterministic, preserves authoring intent) not alphabetical.
      fail_step() cascades SKIPPED to transitive dependents by default
      (cascade_skip=True, overridable) since a step whose dependency
      failed can never become executable -- this is the only path that
      produces StepStatus.SKIPPED and the only way is_complete() can give
      a correct answer without manual intervention. Plan.steps persists
      as a single JSON column (PlanModel.steps) rather than a separate
      table, matching the existing precedent for Turn.tool_calls and
      Provider.capabilities/depends_on -- every read/write in this task
      needs the whole ordered list, nothing needs cross-plan step
      queries. Dependency-graph cycle/reference validation reuses
      core.registry.dependency_resolution.resolve_dependencies()
      unchanged (A-003) rather than a new implementation.
    status: recorded


  - id: B-DEC-017
    task_id: B-006-tool-execution-recovery-validation
    decision: >
      Merged origin/worker/claude-a into worker/claude-b locally
      (commit b4fb5a1) -- required because B-006's required proof
      needs Runtime/Driver/Checkpoint code (Claude A's lane) and
      Tool Execution code (Claude B's lane, B-004) to run in the same
      process, and the two branches had never been integrated despite
      both being individually complete. worker/claude-a itself was
      not modified or pushed to. No source-code merge conflicts
      (non-overlapping package roots: src/core|application|
      infrastructure|config for A, src/neptune/* for B) -- conflicts
      were confined to shared coordination files (.gitignore,
      DEVELOPMENT_STATE/*.yaml, tests/conftest.py) and resolved by
      union/concatenation, since both sides' entries are independently
      namespaced with no overlapping keys.
      Found and fixed during resolution: both branches independently
      created an ADR numbered 037 with unrelated content. Renamed
      Claude B's to ADR-039 (next free number after A's ADR-038);
      fixed every reference. Full combined suite verified green
      post-merge: 111 passed, 4 skipped, before B-006's own new test
      was added.
    reversible: true
    note: "Process/coordination finding, not an architecture decision -- flagging for director review of the two-agent methodology's cross-branch integration cadence."

  - id: B-DEC-018
    task_id: B-006-tool-execution-recovery-validation
    decision: >
      Built ToolPortAdapter (neptune/infrastructure/tools/
      tool_port_adapter.py) to bridge Core's opaque, attribution-free
      ToolPort.execute(dict) -> dict to Neptune's own ToolCall/
      ToolResult, which require task_id/session_id/turn_id per
      TOOL_CONTRACT invariant 2. Neither contract was changed; the
      adapter absorbs the gap entirely on Neptune's side. turn_id has
      no Core-side equivalent to pass through, so a clearly-labeled
      placeholder ("{session_id}-pending-turn") is used -- it carries
      no functional meaning on either side. Full rationale and
      consequences in 05_DECISIONS/ADR-044-toolport-attribution-seam.md
      (renumbered from ADR-040 during the C-002 correction sprint,
      then from ADR-042 during merge-conflict resolution when
      worker/claude-b was merged into worker/claude-a -- see
      C-DEC-001 and the merge-resolution task's own decision record).
    reversible: true


  - id: C-DEC-001
    task_id: C-002-C-003-repository-correction-sprint
    decision: >
      Second ADR-numbering collision found and fixed (first was the
      ADR-037 collision resolved during B-006, B-DEC-017). Claude A
      independently merged worker/claude-b into worker/claude-a
      (commit 42b3cd1) while, in parallel, Claude A's own A-006/A-007
      work had independently claimed ADR-039
      (resolution-layer-selection-policy.md) and ADR-040
      (plan-executor-policy.md) -- the same numbers Claude B's
      B-005/B-006 work had claimed (observation-feedback-format.md,
      toolport-attribution-seam.md) after the first collision's fix.
      Fast-forward merged origin/worker/claude-a's latest (42b3cd1)
      into worker/claude-b (zero conflicts -- worker/claude-b's prior
      commit was already an ancestor). Resolved by renumbering
      Claude B's two ADRs to ADR-041 and ADR-042 (next free numbers),
      leaving Claude A's ADR-039/ADR-040 untouched, consistent with
      the same rationale used for the first collision: avoid touching
      content the other lane's own in-progress work may already
      reference. Updated every reference (00_ADR_INDEX.md,
      DEVELOPMENT_STATE/assignments.yaml, decisions.yaml,
      src/neptune/application/observation_loop.py). Verified
      programmatically: all 42 ADR files (001-042) have unique,
      sequential numbers with no gaps, and 00_ADR_INDEX.md's entries
      exactly match the filesystem (set equality confirmed via
      script, not just visual inspection).
    reversible: true
    note: >
      Second occurrence of the same class of problem as B-DEC-017.
      Recommend the director consider a lighter-weight ADR-number
      reservation mechanism (e.g. a single shared NEXT_ADR_NUMBER
      counter in DEVELOPMENT_STATE, claimed atomically) if the
      two-agent methodology continues to develop both lanes in
      parallel without frequent cross-branch syncs -- this is the
      second time in three tasks that isolated branches have produced
      the same collision independently.

  - id: C-DEC-002
    task_id: C-002-C-003-repository-correction-sprint
    decision: >
      Added requests>=2.31,<3.0 to requirements.txt -- the only
      dependency-declaration file in the repository (confirmed no
      pyproject.toml/setup.py/poetry.lock/Pipfile exist anywhere via
      a full repository search). requests is imported in exactly two
      places: src/neptune/infrastructure/providers/groq_adapter.py
      (production, B-003) and tests/test_groq_adapter_mocked.py
      (test, for requests.exceptions.Timeout/ConnectionError).
      Verified via a genuinely fresh virtual environment
      (python -m venv, pip install -r requirements.txt only, no
      packages carried over from the ambient environment): pip
      install succeeded, `pytest --collect-only` collected all 148
      tests with zero collection errors, and the full suite ran 136
      passed / 12 skipped -- identical to the pre-fix ambient-
      environment baseline. All 12 skips have clean, correctly-
      attributed non-dependency reasons (8x "Postgres not reachable",
      4x "GROQ_API_KEY not set") -- none are masked import/dependency
      failures. The venv itself was deleted after verification, never
      committed.
    reversible: true
    note: >
      Docker Desktop was not running during this session's fresh-venv
      verification (confirmed via `docker ps` failing to reach the
      daemon), which is why the 8 Postgres-dependent integration
      tests skipped rather than ran. This is unrelated to the
      dependency fix -- the same suite successfully exercised live
      Postgres earlier in this development history (B-006) with this
      exact dependency set. Flagged under REMAINING RISKS in the
      final report, not treated as a defect in this correction.


  - id: C-DEC-003
    task_id: C-002-C-003-repository-correction-sprint
    decision: >
      Found and fixed one additional repository-consistency defect
      while resolving C-002: DEVELOPMENT_STATE/assignments.yaml's
      NEPTUNE-A-007-PLANNING-LAYER entry contained an unquoted list
      item ("- src/core/planning/ (models.py: Goal/Plan/PlanStep/
      StepStatus; executor.py: PlanExecutor; errors.py)") whose
      embedded ": " sequences made the file invalid YAML --
      yaml.safe_load raised ScannerError: "mapping values are not
      allowed here". This predates this sprint (came in via Claude
      A's own A-007 commit, confirmed by inspecting the line before
      any edit of mine touched it) and was not caused by either merge
      in this task. Fixed by quoting the entire list-item value;
      content/meaning unchanged, only made syntactically valid.
      Swept the remaining DEVELOPMENT_STATE/*.yaml files
      (decisions, workers, dependencies, blockers, integration_queue)
      for the same class of issue -- none found. Not swept beyond
      DEVELOPMENT_STATE/, since C-002/C-003's scope is ADR cleanup and
      the requests dependency specifically; broader repository-wide
      YAML validation was not requested and risks scope creep into
      files outside this sprint's mandate.
    reversible: true
    note: >
      Flagging for the director: this is the kind of defect that a
      simple CI check (`python -c "import yaml, sys; [yaml.safe_load(open(f)) for f in sys.argv[1:]]"`
      over DEVELOPMENT_STATE/*.yaml) would catch automatically before
      merge, rather than being discovered incidentally during an
      unrelated correction sprint.


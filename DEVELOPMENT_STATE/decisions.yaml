      Summary: added core.registry.model_registry.Model (no fixed
      vocabulary, unlike the other four registries -- model ids are
      provider-published and open-ended) representing model_id,
      provider_id, provider_model_name, verification metadata,
      operational status, plus capabilities/depends_on for consistency
      with the reconciliation and dependency-resolution work this task
      also does. Provider extended with 7 fields migrated from the
      deprecated B-side ProviderRecord (regions, endpoints,
      pricing_snapshot, quota_snapshot, health_snapshot, terms_url,
      fallback_providers); failure_history and cache_characteristics

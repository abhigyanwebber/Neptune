      and descriptive-only respectively). fallback_providers kept
      distinct from depends_on -- different semantics (substitute vs.
      prerequisite), must not be conflated in dependency resolution.
      KNOWN_CAPABILITIES extended with summarization/classification/
      embedding (genuinely distinct task-type capabilities); fast_general
      and frontier_escalation deliberately rejected (cost-tier and
      routing-policy concepts, not capabilities). registry_loader.py/
      registry_exporter.py extended additively (model_registry optional
      parameter) -- zero breaking changes to A-004/A-006 callers, 164
      tests passing including a genuine two-OS-process recovery proof for
      the new Model entity. GatewayService cutover and ModelGatewayPort
      adapter explicitly NOT built -- next milestone per
      DIRECTOR_REVIEW_001.md/DIRECTOR_DECISION_REGISTRY.md.

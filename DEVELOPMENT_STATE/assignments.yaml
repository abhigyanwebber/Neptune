  - task_id: B-003-first-real-provider-integration
    worker_id: B
    title: "First Real Provider Integration"
    status: complete
    authorized_by: director
    scope: >
      Converted GroqAdapter scaffold to a live implementation using
      real HTTPS requests (requests library, no provider SDK/litellm
      dependency), externalized config (GroqConfig.from_env(), no
      hardcoded secrets), full HTTP error-type mapping, mocked
      failure-mode tests (invalid key, unavailable model, timeout,
      rate limit, connection error, server error), a Runtime stand-in
      script and a gated live e2e test suite driving the request
      through ModelGatewayService/CapabilityRouter (not direct
      adapter invocation), and a capability-registration probe script.
    contracts_implemented: []
    contracts_not_modified:
      - MODEL_CONTRACT
      - PROVIDER_CONTRACT
      - ROUTER_CONTRACT
      - TOOL_CONTRACT
      - PERMISSION_CONTRACT
      - RUNTIME_CONTRACT
      - OBSERVABILITY_CONTRACT
    runtime_modified: false
    blocker: null
    resolution: >
      Live GROQ_API_KEY provided by human operator on 2026-08-15 for
      one-time in-memory use only (not persisted, not committed, not
      written to any file). Live smoke test and live e2e test suite
      (3 tests) both passed against a real Groq model. A real bug was
      found and fixed during validation: ModelRegistry.candidates_for
      was passing the registry's internal entry key
      (e.g. "groq-llama-3.3-70b-versatile") as the provider-facing
      model_id instead of the actual Groq model name
      ("llama-3.3-70b-versatile"), causing a 404 from Groq. Fixed in
      src/neptune/infrastructure/models/registry.py (one-line change,
      RoutingCandidate.model_id now sources from ModelRecord.model,
      not ModelRecord.id). Corresponding test assertions updated in
      tests/test_registry.py. Full suite: 25 passed (22 always-run +
      3 live, live tests skip automatically when no key is present).
    unblock_action: null


